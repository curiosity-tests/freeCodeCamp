  e2e:
    name: E2E
    if: ${{ 'push' == 'pull_request' }}
    needs: [build, build-e2e-api]
    uses: ./.github/workflows/e2e-playwright.yml
    with:
      chalk_on: ${{ inputs.leg == 'instrumented' && 'true' || 'false' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
    secrets: inherit

  test:
    name: Test
    needs: build
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        node-version: [24]

    steps:
    - name: Checkout
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
        submodules: 'recursive'
        persist-credentials: false
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38   # v6
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86   # v6
      id: pnpm-install
      with:
        run_install: false

    - name: Setup Turbo Cache
      uses: ./.github/actions/setup-turbo-cache
      with:
        turbo-token: ${{ secrets.TURBO_TOKEN }}
        turbo-signature-key: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

    - name: Set Environment variables
      run: |
        sed '/^[[:space:]]*#/d; /^$/d' sample.env >> $GITHUB_ENV
        cat sample.env

    - name: Start MongoDB
      run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.ports.yml up -d

    - name: Install Dependencies
      run: |
        echo pnpm version $(pnpm -v)
        pnpm install

    - name: Install Chrome for Puppeteer
      run: pnpm -F=curriculum install-puppeteer

    - name: Run Tests
